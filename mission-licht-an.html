<!DOCTYPE html>
<!-- Entscheidungen:
Einsatztyp: Lernmaterial (Einführung Elektronik), Zielgruppe Schülerinnen und Schüler Untergymnasium (1.–2. Klasse), Gerät gemischt (Desktop, Tablet, Handy)
Sprache: Deutsch, Schweizer Rechtschreibung, Sie-Form, keine Programmierkenntnisse nötig, keine Hardware nötig (alles simuliert)
Aufbau: Rahmengeschichte «Station Volta», 7 Levels; pro Level: Vermutung -> Experiment (Simulation) -> Erklärung (Merke) -> Check-Fragen
Interaktivität: voll (Simulationen, Herausforderungen, Wahrheitstabellen, Quiz)
Rückmeldung: sofort mit Erklärung, falsche Antworten wiederholbar; alle richtig = Code-Teil
Freischaltung: Levels nacheinander; Lehrperson-Schalter in der Fusszeile öffnet alle Levels
Türcode: LEUCHTE (ein Buchstabe pro Level), Eingabe am Schluss
Datenhaltung: pro Browser (localStorage: Fortschritt, Vermutungen, Designwahl), nur Komfort
Export: keiner
Design: Nord-Farbschema, Open Sans (Text), Google Sans Code (Messwerte, Formeln, Labels)
Varianten (umschaltbar): A «Station» dunkel/technisch, Google Sans Code für Labels; B «Werkstatt» hell/freundlich, runde Formen, Aurora-Farbe je Level
-->
<html lang="de-CH" data-variant="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission: Licht an · Einführung Elektronik</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,400;0,600;1,400&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
:root{
  --nord0:#2E3440;--nord1:#3B4252;--nord2:#434C5E;--nord3:#4C566A;
  --nord4:#D8DEE9;--nord5:#E5E9F0;--nord6:#ECEFF4;
  --nord7:#8FBCBB;--nord8:#88C0D0;--nord9:#81A1C1;--nord10:#5E81AC;
  --nord11:#BF616A;--nord12:#D08770;--nord13:#EBCB8B;--nord14:#A3BE8C;--nord15:#B48EAD;
  --font:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"Google Sans Code",ui-monospace,"Cascadia Code",Consolas,"SF Mono",monospace;
  --ok:var(--nord14);--warn:var(--nord13);--bad:var(--nord11);--special:var(--nord15);--info:var(--nord8);
  --accent-fill:var(--nord8);--on-fill:var(--nord0);
}
/* Variante A: Station (dunkel, technisch) */
html[data-variant="a"]{
  --bg:var(--nord0);--surface:var(--nord1);--surface-2:var(--nord2);--line:var(--nord3);
  --text:var(--nord6);--muted:var(--nord4);--accent:var(--nord8);
  --top-bg:var(--nord1);--top-line:var(--nord2);
  --radius:5px;--radius-lg:8px;--label-font:var(--font-mono);
  --wire:var(--nord4);--glass:var(--nord2);--glass-stroke:var(--nord4);--metal:var(--nord3);--metal-line:var(--nord1);
  --dot:var(--nord8);--sim-bg:var(--nord0);--tip:var(--nord4);
  --h1:1.7rem;--h2:1.6rem;
}
/* Variante B: Werkstatt (hell, freundlich) */
html[data-variant="b"]{
  --bg:var(--nord6);--surface:var(--nord5);--surface-2:var(--nord4);--line:var(--nord4);
  --text:var(--nord0);--muted:var(--nord3);--accent:var(--nord10);
  --top-bg:var(--nord5);--top-line:var(--nord4);
  --radius:14px;--radius-lg:22px;--label-font:var(--font);
  --wire:var(--nord3);--glass:var(--nord6);--glass-stroke:var(--nord3);--metal:var(--nord9);--metal-line:var(--nord6);
  --dot:var(--nord10);--sim-bg:var(--nord6);--tip:var(--nord3);
  --h1:2.1rem;--h2:2rem;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:400 17px/1.6 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:underline}
h1,h2,h3{line-height:1.2;margin:0}
p{margin:.5em 0}
.muted{color:var(--muted)}
code,.mono{font-family:var(--font-mono)}

/* Kopf */
.top{background:var(--top-bg);border-bottom:1px solid var(--top-line);position:sticky;top:0;z-index:10}
.top-inner{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;gap:12px 20px;align-items:center;flex-wrap:wrap}
.brand{flex:1 1 220px;min-width:0}
.brand-kicker{font-family:var(--label-font);font-size:.78rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.brand h1{font-size:var(--h1);font-weight:700}
html[data-variant="a"] .brand h1{font-size:1.35rem;letter-spacing:.02em}
.codebar{display:flex;gap:5px;align-items:center}
.codebar .lbl{font-family:var(--label-font);font-size:.75rem;color:var(--muted);margin-right:4px}
.slot{width:1.9rem;height:2.3rem;display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:1.1rem;border:2px solid var(--line);border-radius:var(--radius);color:var(--muted);background:var(--bg)}
.slot.got{background:var(--nord13);border-color:var(--nord13);color:var(--nord0);animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 12px;font-size:.85rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-fill);color:var(--on-fill);font-weight:600}

main{max-width:1000px;margin:0 auto;padding:20px 16px 40px}

/* Buttons */
.btn{border:2px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:var(--radius);cursor:pointer;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-fill)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.mini:focus-visible,.card:focus-visible,.seg button:focus-visible,[role=button]:focus-visible,.tcell:focus-visible{outline:3px solid var(--nord13);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}

/* Startseite */
.intro{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px 22px;margin-bottom:22px}
.intro h2{font-size:var(--h2);font-weight:700;margin-bottom:8px}
html[data-variant="a"] .intro{border-left:4px solid var(--nord8)}
.log-label,.story-label,.kicker{font-family:var(--label-font);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px}
.howto div{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;font-size:.92rem}
.howto b{display:block;font-family:var(--label-font);font-size:.8rem;color:var(--accent);margin-bottom:2px}
html[data-variant="b"] .howto b{color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:150px;transition:transform .15s,border-color .15s}
.card:hover:not(:disabled){transform:translateY(-2px);border-color:var(--accent)}
.card:disabled{cursor:not-allowed;opacity:.55}
.card .num{font-family:var(--font-mono);font-weight:600;color:var(--accent);font-size:.9rem}
.card .sys{font-size:.85rem;color:var(--muted)}
.card .ttl{font-weight:700;font-size:1.08rem;line-height:1.3}
.card .chip{margin-top:auto}
html[data-variant="b"] .card{border-top:7px solid var(--lv)}
html[data-variant="b"] .card .num{width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;background:var(--lv);color:var(--nord0);font-family:var(--font);font-weight:700;font-size:1.1rem}
.chip{display:inline-block;align-self:flex-start;font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.ok{background:var(--ok);border-color:var(--ok);color:var(--nord0)}
.chip.open{background:var(--nord13);border-color:var(--nord13);color:var(--nord0)}
.final{margin-top:24px;background:var(--surface);border:2px dashed var(--line);border-radius:var(--radius-lg);padding:20px}
.final.ready{border-style:solid;border-color:var(--nord13)}
.final h3{font-size:1.25rem;margin-bottom:6px}
.codein{font-family:var(--font-mono);font-size:1.4rem;letter-spacing:.35em;text-transform:uppercase;width:12ch;padding:6px 10px;border:2px solid var(--line);border-radius:var(--radius);background:var(--bg)}

/* Level */
.lvl-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.lvl-tag{font-family:var(--label-font);font-size:.85rem;color:var(--muted)}
.lvl-head{margin-bottom:14px}
.lvl-head h2{font-size:var(--h2);font-weight:700;margin-top:4px}
html[data-variant="b"] .lvl-head{border-left:8px solid var(--lv);padding-left:14px}
.story{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px 18px;margin-bottom:18px}
html[data-variant="a"] .story{border-left:4px solid var(--nord8)}
html[data-variant="a"] .story p{font-style:italic}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px 18px;margin-bottom:16px;scroll-margin-top:90px}
.step-head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.step-num{width:1.8rem;height:1.8rem;display:grid;place-items:center;border-radius:var(--radius);background:var(--accent-fill);color:var(--on-fill);font-family:var(--font-mono);font-weight:600;font-size:.95rem;flex:none}
html[data-variant="b"] .step-num{border-radius:50%;background:var(--lv)}
.step-head h3{font-size:1.15rem;font-weight:600}
html[data-variant="a"] .step-head h3{font-family:var(--font-mono);font-weight:600;font-size:1rem;text-transform:uppercase;letter-spacing:.05em}
.q{font-weight:600}
.task{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px}
.opts{display:grid;gap:8px;margin:8px 0}
.opt{display:block;width:100%;text-align:left;padding:10px 14px;border:2px solid var(--line);background:var(--bg);border-radius:var(--radius);cursor:pointer;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.chosen{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.opt.ok{border-color:var(--ok);background:rgba(163,190,140,.22)}
.opt.ok::before{content:"✓ ";font-weight:700}
.opt.bad{border-color:var(--bad);background:rgba(191,97,106,.16)}
.opt.bad::before{content:"✗ ";font-weight:700}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.bad){opacity:.6}
.fb{margin-top:6px;padding:8px 12px;border-radius:var(--radius);border-left:4px solid transparent}
.fb:empty{display:none}
.fb.ok{border-left-color:var(--ok);background:rgba(163,190,140,.16)}
.fb.bad{border-left-color:var(--bad);background:rgba(191,97,106,.12)}
.check{margin:14px 0 18px}
.note{font-size:.95rem}
.compare{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px}
.merke{border-left:5px solid var(--special);background:rgba(180,142,173,.14);border-radius:var(--radius);padding:12px 16px}
.merke-label{font-family:var(--label-font);font-weight:600;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.merke ul{margin:.4em 0;padding-left:1.2em}
.formula{font-family:var(--font-mono);background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;display:inline-block;margin:4px 0;font-size:1rem}
.reward{display:flex;gap:16px;align-items:center;background:rgba(235,203,139,.18);border:2px solid var(--nord13);border-radius:var(--radius-lg);padding:16px;margin-top:10px;animation:pop .5s ease}
.reward-tile{flex:none;width:4rem;height:4.6rem;display:grid;place-items:center;background:var(--nord13);color:var(--nord0);font-family:var(--font-mono);font-weight:600;font-size:2.4rem;border-radius:var(--radius)}
.reward p{margin:.2em 0 .6em}

/* Simulationen */
.sim{background:var(--sim-bg);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-top:10px}
.sim-svg{width:100%;height:auto;display:block}
.svgwrap{max-width:560px;margin:0 auto}
.twin{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.twin{grid-template-columns:1fr}}
.fig{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px}
.fig figcaption{font-family:var(--label-font);font-size:.85rem;text-align:center;color:var(--muted);margin-top:4px}
.wire{stroke:var(--wire);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.wire-end{fill:var(--wire)}
.pipe{stroke:var(--nord9);stroke-opacity:.45;stroke-width:18;fill:none;stroke-linejoin:round}
.glass{fill:var(--glass);stroke:var(--glass-stroke);stroke-width:2}
.filament{stroke:var(--muted);stroke-width:1.6;fill:none;stroke-linejoin:round}
.filament.hot{stroke:var(--nord13);stroke-width:2}
.metal{fill:var(--metal)}
.thread{stroke:var(--metal-line);stroke-width:1.5}
.tip{fill:var(--tip)}
.batt{fill:var(--nord10);transition:fill .4s}
.batt.hot{fill:var(--nord12)}
.battxt{fill:var(--nord6);font:600 15px var(--font-mono)}
.svgtxt{fill:var(--text);font:400 12px var(--font-mono)}
.svgtxt.big{font-size:14px;font-weight:600}
.dot{fill:var(--dot)}
.dot.water{fill:var(--nord8)}
.dot.small{fill:var(--nord15)}
.meter{fill:var(--surface);stroke:var(--wire);stroke-width:2}
.pump{fill:var(--surface);stroke:var(--nord9);stroke-width:3}
.blade{stroke:var(--nord9);stroke-width:4;stroke-linecap:round}
.resistor{fill:var(--nord12);stroke:var(--wire);stroke-width:2}
.obj{stroke:var(--wire);stroke-width:2;fill:var(--surface)}
.obj.empty{stroke-dasharray:4 3;fill:none}
.led{fill:var(--nord11);opacity:.55;transition:opacity .2s,fill .3s}
.led.on{opacity:1}
.led.dead{fill:var(--nord3);opacity:1}
.crack{stroke:var(--nord0);stroke-width:2;fill:none}
.smoke circle{fill:var(--nord4);opacity:0}
.smoke.puff circle{animation:smoke 1.6s ease-out forwards}
.smoke.puff circle:nth-child(2){animation-delay:.2s}
.smoke.puff circle:nth-child(3){animation-delay:.4s}
@keyframes smoke{0%{opacity:.9;transform:translateY(0) scale(.5)}100%{opacity:0;transform:translateY(-50px) scale(2)}}
.smoke circle{transform-box:fill-box;transform-origin:center}
.flash{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.bulb[role=button]{cursor:pointer}
.bulb.removed .glass{stroke-dasharray:4 3;fill:none}
.bulb .xmark{fill:var(--bad);font:700 16px var(--font);opacity:0}
.bulb.removed .xmark{opacity:1}
.tr{fill:var(--surface);stroke:var(--wire);stroke-width:2}
.tline{stroke:var(--wire);stroke-width:2.5;fill:none}
.contact{fill:var(--wire)}
.tbox{fill:var(--surface-2);stroke:var(--wire);stroke-width:2;transition:fill .2s}
.tbox.on{fill:var(--nord14)}
.tbox-t{fill:var(--text);font:600 11px var(--font-mono)}
.tbox.on + .tbox-t{fill:var(--nord0)}
.ground{fill:var(--nord3)}
.house{fill:var(--nord4)}
.roof{fill:var(--nord12)}
.win{fill:var(--nord2)}
.post{stroke:var(--nord3);stroke-width:5}
html[data-variant="a"] .post{stroke:var(--nord4)}

.cfg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cfg{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:8px}
.cfg.is-ok{border-color:var(--ok)}
.cfg.is-bad{border-color:var(--bad)}
.cfg-n{font-family:var(--label-font);font-size:.8rem;color:var(--muted)}
.mini-row{display:flex;gap:6px;margin-top:4px}
.mini{flex:1;border:2px solid var(--line);background:var(--bg);border-radius:var(--radius);padding:4px 6px;font-size:.85rem;cursor:pointer}
.mini.chosen{border-color:var(--accent);background:var(--accent-fill);color:var(--on-fill);font-weight:600}
.mini:disabled{cursor:default}
.cfg-res{font-size:.88rem;margin:6px 0 0;line-height:1.45}
.cfg-res:empty{display:none}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chipbtn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.92rem}
.chipbtn:hover{border-color:var(--accent)}
.chipbtn.done{border-style:dashed;color:var(--muted)}
.chipbtn.active{border-color:var(--nord13);border-style:solid;color:var(--text);font-weight:600}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
@media (max-width:600px){.cols{grid-template-columns:1fr}}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;min-height:70px}
.col h4{margin:0 0 4px;font-size:.88rem}
.col ul{margin:0;padding-left:1.1em;font-size:.9rem}
.col.c-gut{border-top:4px solid var(--ok)}
.col.c-schwach{border-top:4px solid var(--warn)}
.col.c-nicht{border-top:4px solid var(--bad)}
.readout{font-family:var(--font-mono);font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;margin-top:8px}
.status{margin-top:8px;padding:8px 12px;border-radius:var(--radius);background:var(--surface);border-left:4px solid var(--info)}
.status.bad{border-left-color:var(--bad)}
.status.ok{border-left-color:var(--ok)}
.status.warn{border-left-color:var(--warn)}
.ctrl{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;margin-top:12px}
.ctrl label{font-weight:600;font-size:.95rem}
.ctrl output{font-family:var(--font-mono);min-width:5.5ch;text-align:right}
input[type=range]{width:100%;accent-color:var(--nord8)}
html[data-variant="b"] input[type=range]{accent-color:var(--nord10)}
.chal{list-style:none;padding:0;margin:10px 0}
.chal li{padding:6px 10px;border-radius:var(--radius);margin-bottom:4px;border:1px solid var(--line);background:var(--surface)}
.chal li.cur{border-color:var(--nord13);border-width:2px;font-weight:600}
.chal li.done{border-color:var(--ok);background:rgba(163,190,140,.16)}
.chal li.done::before{content:"✓ ";font-weight:700}
.chal li.wait{opacity:.5}
.rbtns{display:flex;flex-wrap:wrap;gap:6px}
.rbtns button{font-family:var(--font-mono);border:2px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:4px 10px;cursor:pointer}
.rbtns button[aria-pressed="true"]{border-color:var(--accent-fill);background:var(--accent-fill);color:var(--on-fill);font-weight:600}
.help{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:8px 12px;margin-top:10px;font-size:.92rem}
.ttables{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
@media (max-width:560px){.ttables{grid-template-columns:1fr}}
table.tt{border-collapse:collapse;width:100%;font-family:var(--font-mono);background:var(--surface)}
.tt th,.tt td{border:1px solid var(--line);padding:4px 8px;text-align:center}
.tt caption{font-family:var(--font);font-weight:600;text-align:left;padding-bottom:4px}
.tcell{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:var(--radius);cursor:pointer;font-family:var(--font-mono);font-weight:600;padding:2px 0}
.tcell.ok{border-color:var(--ok);background:rgba(163,190,140,.22)}
.tcell.bad{border-color:var(--bad);background:rgba(191,97,106,.16)}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.toggles{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tog{font-family:var(--font-mono);font-weight:600;border:2px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:6px 14px;cursor:pointer}
.tog[aria-pressed="true"]{background:var(--nord14);border-color:var(--nord14);color:var(--nord0)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.slotcard{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius);padding:10px}
.slotcard.ok{border-color:var(--ok)}
.slotcard.bad{border-color:var(--bad)}
.slotcard h4{margin:0 0 6px;font-size:.95rem}
.slotcard .fb{font-size:.88rem}

<script>
"use strict";
/* ---------- Grundfunktionen ---------- */
const NS = "http://www.w3.org/2000/svg";
const KEY = "mission-licht-an-v1";
const CODE = "LEUCHTE";
let state = {variant:"a", solved:{}, pred:{}, exp:{}, teacher:false, final:false};
try { const raw = localStorage.getItem(KEY); if (raw) state = Object.assign(state, JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} }

function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const k in (attrs||{})){
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(c => { if (c === null || c === undefined || c === false) return; e.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c); });
  return e;
}
function s(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in (attrs||{})) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function txt(svg, x, y, t, cls, anchor){ const e = s("text", {x, y, class: cls || "svgtxt", "text-anchor": anchor || "middle"}, svg); e.textContent = t; return e; }
function svgIn(parent, vb, label){ const svg = s("svg", {viewBox: vb, class: "sim-svg", role: "img", "aria-label": label}); parent.appendChild(svg); return svg; }
function fmt(x){ return String(parseFloat(x.toFixed(2))); }
function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }

/* ---------- Animation: fliessende Elektronen, drehende Teile ---------- */
let flows = [], spinners = [], lastT = 0;
function addFlow(svg, d, n, r, cls){
  const p = s("path", {d, fill: "none", stroke: "none"}, svg);
  const len = p.getTotalLength();
  const dots = [];
  for (let i = 0; i < n; i++) dots.push(s("circle", {r: r || 3, class: cls || "dot"}, svg));
  const f = {svg, p, len, dots, speed: 0, off: 0};
  f.set = v => { f.speed = v; placeFlow(f); };
  flows.push(f); placeFlow(f);
  return f;
}
function placeFlow(f){
  f.dots.forEach((d, i) => {
    let L = (f.off + i * f.len / f.dots.length) % f.len; if (L < 0) L += f.len;
    const pt = f.p.getPointAtLength(L);
    d.setAttribute("cx", pt.x.toFixed(1)); d.setAttribute("cy", pt.y.toFixed(1));
    d.style.opacity = f.speed > 0.01 ? 1 : 0;
  });
}
function removeFlows(svg){ flows = flows.filter(f => f.svg !== svg); spinners = spinners.filter(sp => sp.svg !== svg); }
function addSpinner(svg, g, cx, cy){ const sp = {svg, g, cx, cy, speed: 0, ang: 0}; spinners.push(sp); return sp; }
function resetAnim(){ flows = []; spinners = []; }
function tick(t){
  const dt = Math.min(60, t - lastT) / 1000; lastT = t;
  for (const f of flows) if (f.speed > 0.01){ f.off += f.speed * dt; placeFlow(f); }
  for (const sp of spinners) if (sp.speed > 0){ sp.ang = (sp.ang + sp.speed * dt) % 360; sp.g.setAttribute("transform", `rotate(${sp.ang.toFixed(1)} ${sp.cx} ${sp.cy})`); }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* Glühlämpchen (Schema) */
function bulb(svg, cx, cy, r, glowId){
  const g = s("g", {class: "bulb"}, svg);
  const glow = s("circle", {cx, cy, r: r * 2.4, fill: `url(#${glowId || "g-glow"})`, opacity: 0}, g);
  s("circle", {cx, cy, r, class: "glass"}, g);
  const fil = s("path", {d: `M${cx-r*.5} ${cy+r*.55} L${cx-r*.3} ${cy-r*.25} L${cx-r*.1} ${cy+r*.15} L${cx+r*.1} ${cy-r*.25} L${cx+r*.3} ${cy+r*.15} L${cx+r*.5} ${cy+r*.55}`, class: "filament"}, g);
  const x = s("text", {x: cx, y: cy + 6, class: "xmark", "text-anchor": "middle"}, g); x.textContent = "✕";
  return {g, set(b){ b = clamp(b, 0, 1); glow.setAttribute("opacity", b); fil.classList.toggle("hot", b > 0.08); }};
}
function battery(svg, x, y, w, hgt, label){
  const r = s("rect", {x, y, width: w, height: hgt, rx: 5, class: "batt"}, svg);
  s("rect", {x: x + w/2 - 7, y: y - 7, width: 14, height: 7, rx: 2, class: "metal"}, svg);
  txt(svg, x + w/2, y + 17, "+", "battxt");
  if (label) txt(svg, x + w/2, y + hgt/2 + 6, label, "battxt").style.fontSize = "11px";
  txt(svg, x + w/2, y + hgt - 6, "−", "battxt");
  return r;
}

/* ---------- Level 1 ---------- */
function buildL1(c, done){
  const CF = [
    {w:["M40 32 V14 H120 V90 H152","M40 130 V148 H165 V113"], lit:true,
     why:"Der Strom fliesst von einem Pol durch das Gewinde, den Glühdraht und den Fusskontakt zum anderen Pol."},
    {w:["M40 32 V14 H205 V130 H169 V113","M40 130 V148 H161 V113"], lit:false,
     why:"Beide Drähte berühren nur den Fusskontakt. Der Strom muss gar nicht durch den Glühdraht."},
    {w:["M40 32 V14 H120 V90 H152","M40 130 V148 H105"], end:[105,148], lit:false,
     why:"Ein Draht hängt lose. Der Kreis ist offen, also fliesst kein Strom."},
    {w:["M40 32 V14 H205 V130 H165 V113","M40 130 V148 H120 V90 H152"], lit:true,
     why:"Es spielt keine Rolle, welcher Pol mit welchem Kontakt verbunden ist."},
    {w:["M40 32 V14 H205 V90 H178","M40 130 V148 H165 V113"], lit:true,
     why:"Das Gewinde ist rundherum ein Kontakt. Die Seite spielt keine Rolle."},
    {w:["M40 32 V14 H120 V90 H152","M40 130 V148 H165 V113","M40 32 V24 H8 V140 H40 V130"], lit:false, short:true,
     why:"Der Draht direkt von Plus nach Minus ist ein Kurzschluss. Fast der ganze Strom nimmt diesen bequemen Weg, die Batterie wird heiss."}
  ];
  const guesses = CF.map(() => null);
  let tested = false;
  const grid = h("div", {class: "cfg-grid"});
  c.append(grid);
  const testBtn = h("button", {class: "btn primary", disabled: true}, "Alle sechs testen");
  const summary = h("p", {class: "note", "aria-live": "polite"});
  c.append(h("div", {class: "row"}, testBtn, h("span", {class: "muted note"}, "Zuerst bei allen sechs eine Vermutung wählen.")), summary);
  const cards = CF.map((cf, i) => {
    const card = h("div", {class: "cfg"}, h("div", {class: "cfg-n"}, `Anordnung ${i+1}`));
    grid.append(card);
    const svg = svgIn(card, "0 0 220 160", `Anordnung ${i+1}`);
    const batt = s("rect", {x:20, y:40, width:40, height:90, rx:6, class:"batt"}, svg);
    s("rect", {x:32, y:32, width:16, height:8, rx:2, class:"metal"}, svg);
    txt(svg, 40, 62, "+", "battxt"); txt(svg, 40, 124, "−", "battxt");
    const glow = s("circle", {cx:165, cy:52, r:58, fill:"url(#g-glow)", opacity:0}, svg);
    cf.w.forEach(d => s("path", {d, class:"wire"}, svg));
    if (cf.end) s("circle", {cx:cf.end[0], cy:cf.end[1], r:4, class:"wire-end"}, svg);
    s("circle", {cx:165, cy:52, r:27, class:"glass"}, svg);
    const fil = s("path", {d:"M158 79 L157 50 L161 58 L165 46 L169 58 L173 50 L172 79", class:"filament"}, svg);
    s("rect", {x:152, y:78, width:26, height:26, rx:3, class:"metal"}, svg);
    [85, 91, 97].forEach(y => s("line", {x1:152, x2:178, y1:y, y2:y, class:"thread"}, svg));
    s("circle", {cx:165, cy:108, r:5, class:"tip"}, svg);
    const yes = h("button", {class:"mini", type:"button"}, "leuchtet");
    const no = h("button", {class:"mini", type:"button"}, "leuchtet nicht");
    const res = h("p", {class:"cfg-res"});
    const pick = v => { if (tested) return; guesses[i] = v; yes.classList.toggle("chosen", v); no.classList.toggle("chosen", !v); yes.setAttribute("aria-pressed", v); no.setAttribute("aria-pressed", !v); if (guesses.every(g => g !== null)) testBtn.disabled = false; };
    yes.onclick = () => pick(true); no.onclick = () => pick(false);
    card.append(h("div", {class:"mini-row"}, yes, no), res);
    return {cf, glow, fil, batt, res, card, yes, no};
  });
  testBtn.onclick = () => {
    tested = true; testBtn.disabled = true; let ok = 0;
    cards.forEach((k, i) => {
      k.glow.setAttribute("opacity", k.cf.lit ? 1 : 0);
      k.fil.classList.toggle("hot", k.cf.lit);
      if (k.cf.short) k.batt.classList.add("hot");
      k.yes.disabled = k.no.disabled = true;
      const right = guesses[i] === k.cf.lit; if (right) ok++;
      k.card.classList.add(right ? "is-ok" : "is-bad");
      k.res.innerHTML = `<strong>${k.cf.lit ? "Leuchtet." : "Leuchtet nicht."} ${right ? "✓ Vermutung stimmt." : "✗ Vermutung falsch."}</strong> ${k.cf.why}`;
    });
    summary.textContent = `${ok} von 6 Vermutungen waren richtig. ` + (ok < 6 ? "Lesen Sie bei den rot markierten nach, warum." : "Ausgezeichnet!");
    done();
  };
}

/* ---------- Level 2 ---------- */
function buildL2(c, done){
  const OB = [
    ["Büroklammer", 1, "Eisen ist ein Metall."], ["Münze", 1, "Münzen bestehen aus Metall."],
    ["Alufolie", 1, "Aluminium ist ein Metall."], ["Schlüssel", 1, "Messing ist ein Metall."],
    ["Bleistiftmine", .45, "Grafit ist kein Metall und leitet trotzdem."],
    ["Salzwasser", .3, "Im Wasser gelöstes Salz bildet elektrisch geladene Teilchen, die sich bewegen können."],
    ["Leitungswasser", .04, "Leitet nur ganz wenig: Das Lämpchen bleibt dunkel, das Messgerät zeigt aber etwas an."],
    ["Radiergummi", 0, "Gummi ist ein Isolator."], ["Holzstab", 0, "Trockenes Holz isoliert."],
    ["Glasstab", 0, "Glas ist ein sehr guter Isolator."], ["Plastiklineal", 0, "Kunststoff isoliert."],
    ["Papier", 0, "Trockenes Papier isoliert."]
  ];
  const tested = new Set();
  const wrap = h("div", {class:"svgwrap"}); c.append(wrap);
  const svg = svgIn(wrap, "0 0 320 200", "Durchgangsprüfer");
  const loop = "M38 62 V30 H260 V172 H38 V150";
  ["M38 62 V30 H143","M177 30 H260 V77","M260 113 V172 H204","M136 172 H38 V150"].forEach(d => s("path", {d, class:"wire"}, svg));
  const flow = addFlow(svg, loop, 18, 3);
  battery(svg, 20, 70, 36, 80, "4.5 V");
  const lamp = bulb(svg, 160, 30, 16);
  s("circle", {cx:260, cy:95, r:18, class:"meter"}, svg);
  txt(svg, 260, 100, "A", "svgtxt big");
  s("rect", {x:126, y:166, width:12, height:12, rx:2, class:"metal"}, svg);
  s("rect", {x:202, y:166, width:12, height:12, rx:2, class:"metal"}, svg);
  const objR = s("rect", {x:138, y:160, width:64, height:24, rx:5, class:"obj empty"}, svg);
  const objT = txt(svg, 170, 176, "leer", "svgtxt");
  objT.style.fontSize = "10px";
  txt(svg, 170, 152, "Prüfstelle", "svgtxt").style.fontSize = "10px";
  const readout = h("div", {class:"readout", "aria-live":"polite"}, "Messgerät: 0 mA");
  const status = h("div", {class:"status"}, "Wählen Sie einen Gegenstand und legen Sie ihn in die Prüfstelle.");
  const prog = h("p", {class:"note muted"}, "0 von 12 getestet");
  const chips = h("div", {class:"chips"});
  const lists = {gut: h("ul"), schwach: h("ul"), nicht: h("ul")};
  const cols = h("div", {class:"cols"},
    h("div", {class:"col c-gut"}, h("h4", {}, "✓ leitet gut"), lists.gut),
    h("div", {class:"col c-schwach"}, h("h4", {}, "~ leitet schwach"), lists.schwach),
    h("div", {class:"col c-nicht"}, h("h4", {}, "✗ leitet nicht (Isolator)"), lists.nicht));
  c.append(chips, readout, status, prog, cols);
  let active = null;
  OB.forEach((o, i) => {
    const b = h("button", {class:"chipbtn", type:"button"}, o[0]);
    b.onclick = () => {
      if (active) active.classList.remove("active");
      active = b; b.classList.add("active", "done");
      objR.setAttribute("class", "obj"); objT.textContent = o[0];
      lamp.set(o[1]); flow.set(o[1] * 90 + (o[1] > 0 ? 6 : 0));
      const mA = Math.round(o[1] * 250);
      readout.textContent = `Messgerät: ${mA} mA`;
      const cat = o[1] >= .8 ? "gut" : o[1] > 0 ? "schwach" : "nicht";
      const catT = {gut:"leitet gut", schwach:"leitet schwach", nicht:"leitet nicht"}[cat];
      status.className = "status " + (cat === "gut" ? "ok" : cat === "schwach" ? "warn" : "bad");
      status.innerHTML = `<strong>${o[0]}: ${catT}.</strong> ${o[2]}`;
      if (!tested.has(i)){ tested.add(i); lists[cat].append(h("li", {}, o[0])); }
      prog.textContent = `${tested.size} von 12 getestet` + (tested.size === 12 ? ": alle geprüft!" : "");
      if (tested.size === 12) done();
    };
    chips.append(b);
  });
}

/* ---------- Level 3 ---------- */
function buildL3(c, done){
  let U = 3, R = 2;
  const grid = h("div", {class:"twin"}); c.append(grid);
  const wBox = h("figure", {class:"fig"}), eBox = h("figure", {class:"fig"});
  grid.append(wBox, eBox);
  const loop = "M40 40 H260 V170 H40 Z";
  const ws = svgIn(wBox, "0 0 300 210", "Wasserkreislauf");
  wBox.append(h("figcaption", {}, "Wasserkreislauf"));
  s("path", {d:loop, class:"pipe"}, ws);
  const wf = addFlow(ws, loop, 22, 3.5, "dot water");
  const k1 = s("rect", {x:251, y:82, width:2, height:46, rx:1, class:"metal"}, ws);
  const k2 = s("rect", {x:267, y:82, width:2, height:46, rx:1, class:"metal"}, ws);
  s("circle", {cx:40, cy:105, r:24, class:"pump"}, ws);
  const imp = s("g", {}, ws);
  [0, 90].forEach(a => s("line", {x1:40, y1:87, x2:40, y2:123, class:"blade", transform:`rotate(${a} 40 105)`}, imp));
  const spin = addSpinner(ws, imp, 40, 105);
  txt(ws, 72, 109, "Pumpe", "svgtxt", "start");
  txt(ws, 236, 109, "Engstelle", "svgtxt", "end");
  txt(ws, 150, 200, "Wasserteilchen fliessen im Kreis", "svgtxt").style.fontSize = "10px";

  const es = svgIn(eBox, "0 0 300 210", "Stromkreis");
  eBox.append(h("figcaption", {}, "Stromkreis"));
  s("path", {d:loop, class:"wire"}, es);
  const ef = addFlow(es, loop, 22, 3, "dot");
  s("rect", {x:22, y:72, width:36, height:66, rx:5, class:"batt"}, es);
  const uT = txt(es, 40, 110, "", "battxt"); uT.style.fontSize = "11px";
  txt(es, 72, 109, "Spannung", "svgtxt", "start");
  s("rect", {x:249, y:78, width:22, height:54, rx:3, class:"resistor"}, es);
  const rT = txt(es, 240, 109, "", "svgtxt big", "end");
  s("circle", {cx:150, cy:170, r:16, class:"meter"}, es);
  txt(es, 150, 175, "A", "svgtxt big");
  const iT = txt(es, 150, 200, "", "svgtxt big");

  const ctrl = h("div", {class:"ctrl"});
  const uIn = h("input", {type:"range", min:0, max:12, step:1, value:U, id:"uIn"});
  const rIn = h("input", {type:"range", min:1, max:12, step:1, value:R, id:"rIn"});
  const uOut = h("output", {for:"uIn"}), rOut = h("output", {for:"rIn"});
  ctrl.append(h("label", {for:"uIn"}, "Spannung U (Pumpe)"), uIn, uOut, h("label", {for:"rIn"}, "Widerstand R (Engstelle)"), rIn, rOut);
  const formula = h("div", {class:"formula", "aria-live":"polite"});
  const CH = [
    {t:"Stellen Sie einen Strom von genau 2 A ein.", ok:() => Math.abs(U / R - 2) < 1e-9},
    {t:"Stellen Sie bei einem Widerstand von 4 Ω einen Strom von 3 A ein.", ok:() => R === 4 && U === 12},
    {t:"Halbieren Sie jetzt den Strom auf 1.5 A, ohne die Spannung von 12 V zu verändern.", ok:() => U === 12 && R === 8}
  ];
  let ci = 0;
  const list = h("ol", {class:"chal"});
  const lis = CH.map(x => { const li = h("li", {}, x.t); list.append(li); return li; });
  c.append(ctrl, h("div", {}, formula), h("p", {class:"q", style:"margin-top:14px"}, "Herausforderungen"), list);
  function paint(){ lis.forEach((li, i) => li.className = i < ci ? "done" : i === ci ? "cur" : "wait"); }
  function update(){
    U = +uIn.value; R = +rIn.value; const I = U / R;
    uOut.textContent = U + " V"; rOut.textContent = R + " Ω";
    const sp = I * 16; wf.set(sp); ef.set(sp); spin.speed = U * 35;
    const w = R * 0.6; k1.setAttribute("width", w); k2.setAttribute("x", 269 - w); k2.setAttribute("width", w);
    uT.textContent = U + " V"; rT.textContent = R + " Ω"; iT.textContent = "I = " + fmt(I) + " A";
    formula.textContent = `I = U / R = ${U} V / ${R} Ω = ${fmt(I)} A`;
    while (ci < CH.length && CH[ci].ok()){ ci++; }
    paint();
    if (ci === CH.length){ done(); }
  }
  uIn.oninput = update; rIn.oninput = update;
  update();
}

/* ---------- Level 4 ---------- */
function buildL4(c, done){
  const VALS = [0, 100, 220, 330, 390, 470, 1000, 10000];
  let R = null, on = false, alive = true, burned = 0, achieved = false;
  const wrap = h("div", {class:"svgwrap"}); c.append(wrap);
  const svg = svgIn(wrap, "0 0 320 180", "LED-Schaltung mit Vorwiderstand");
  const loop = "M40 46 V25 H280 V160 H40 V140";
  const wireTop = s("path", {d:"M40 46 V25 H150", class:"wire"}, svg);
  const wireMid = s("path", {d:"M150 25 H210", class:"wire"}, svg);
  s("path", {d:"M210 25 H280 V160 H40 V140", class:"wire"}, svg);
  const flow = addFlow(svg, loop, 18, 3);
  s("rect", {x:22, y:46, width:36, height:94, rx:5, class:"batt"}, svg);
  s("rect", {x:33, y:39, width:14, height:7, rx:2, class:"metal"}, svg);
  txt(svg, 40, 64, "+", "battxt"); txt(svg, 40, 100, "9 V", "battxt"); txt(svg, 40, 134, "−", "battxt");
  const res = s("rect", {x:150, y:15, width:60, height:20, rx:3, class:"resistor"}, svg);
  const rLbl = txt(svg, 180, 55, "Vorwiderstand: ?", "svgtxt");
  const glow = s("circle", {cx:280, cy:88, r:46, fill:"url(#g-glow-red)", opacity:0}, svg);
  const led = s("path", {d:"M268 108 V84 a12 12 0 0 1 24 0 V108 Z", class:"led"}, svg);
  s("rect", {x:264, y:106, width:32, height:5, rx:1, class:"metal"}, svg);
  const crack = s("path", {d:"M276 76 L283 86 L276 93 L284 102", class:"crack"}, svg); crack.style.display = "none";
  txt(svg, 302, 92, "LED", "svgtxt", "start");
  const smoke = s("g", {class:"smoke"}, svg);
  [[278,70],[285,64],[274,60]].forEach(([x,y]) => s("circle", {cx:x, cy:y, r:7}, smoke));

  const rb = h("div", {class:"rbtns", role:"group", "aria-label":"Vorwiderstand"});
  const btns = VALS.map(v => { const b = h("button", {type:"button", "aria-pressed":"false"}, v === 0 ? "kein (Draht)" : v >= 1000 ? (v/1000) + " kΩ" : v + " Ω"); b.onclick = () => { R = v; btns.forEach(x => x.setAttribute("aria-pressed", x === b)); onBtn.disabled = !alive; update(); }; rb.append(b); return b; });

    const SC = [["Mittag", 90, false], ["Bewölkt", 55, false], ["Dämmerung", 25, true], ["Nacht", 5, true]];
    runBtn.onclick = () => {
      runBtn.disabled = hIn.disabled = tIn.disabled = true;
      results.innerHTML = "";
      const tb = h("tbody");
      results.append(h("table", {class:"results"}, h("thead", {}, h("tr", {}, h("th", {}, "Tageszeit"), h("th", {}, "Helligkeit"), h("th", {}, "Soll"), h("th", {}, "Ist"), h("th", {}, ""))), tb));
      let i = 0, okN = 0;
      const stepRun = () => {
        if (i >= SC.length){
          runBtn.disabled = hIn.disabled = tIn.disabled = false;
          const st = h("div", {class:"status " + (okN === 4 ? "ok" : "bad")});
          if (okN === 4){ st.innerHTML = "<strong>Das Nachtlicht funktioniert!</strong> Die Aussenbeleuchtung schaltet genau dann ein, wenn es dunkel wird."; done(); }
          else {
            const tooHigh = !!tb.querySelector("tr[data-err='an']");
            st.innerHTML = "<strong>Noch nicht ganz.</strong> " + (tooHigh ? "Die Lampe brennt schon am Tag: Stellen Sie die Schwelle tiefer ein." : "Die Lampe bleibt in der Dämmerung aus: Stellen Sie die Schwelle höher ein.");
          }
          results.append(st);
          return;
        }
        const [name, hh, want] = SC[i];
        hIn.value = hh; const got = render();
        const ok = got === want; if (ok) okN++;
        const tr = h("tr", {}, h("td", {}, name), h("td", {class:"mono"}, hh + " %"), h("td", {}, want ? "an" : "aus"), h("td", {}, got ? "an" : "aus"), h("td", {}, ok ? "✓" : "✗"));
        if (!ok) tr.setAttribute("data-err", got ? "an" : "aus");
        tb.append(tr);
        i++; setTimeout(stepRun, 750);
      };
      stepRun();
    };
  }
}

  const L = LEVELS[n-1];
  view.style.setProperty("--lv", `var(${L.color})`);
  const top = h("div", {class:"lvl-top"}, h("button", {class:"btn ghost", type:"button", onclick:() => go("home")}, "← Stationskarte"), h("span", {class:"lvl-tag"}, `Level ${n} von 7` + (state.solved[n] ? " · ✓ repariert" : "")));
  const head = h("header", {class:"lvl-head"}, h("div", {class:"kicker"}, `System ${String(n).padStart(2, "0")} · ${L.sys}`), h("h2", {}, L.title));
  const story = h("div", {class:"story"}, h("div", {class:"story-label"}, "Logbuch"), h("p", {}, L.story));
  const s1 = step(1, "Ihre Vermutung"), s2 = step(2, "Experiment"), s3 = step(3, "Erklärung"), s4 = step(4, "Check");
  [s2, s3, s4].forEach(x => x.el.hidden = true);
  view.append(top, head, story, s1.el, s2.el, s3.el, s4.el);
  s1.body.append(h("p", {class:"q"}, L.predict.q));
  const optWrap = h("div", {class:"opts"});
  const note = h("p", {class:"note muted", "aria-live":"polite"});
  s1.body.append(optWrap, note);
  let built = false, restOpen = false;
  const openExp = scroll => {
    s2.el.hidden = false;
    if (!built){ built = true; s2.body.append(h("p", {class:"task"}, L.task)); const box = h("div", {class:"sim"}); s2.body.append(box); L.build(box, expDone); }
    if (scroll) setTimeout(() => s2.el.scrollIntoView({behavior:"smooth", block:"start"}), 60);
  };
  function expDone(){ if (!state.exp[n]){ state.exp[n] = true; save(); } openRest(true); }
  function openRest(scroll){
    if (restOpen) return; restOpen = true;
    s3.el.hidden = false; s4.el.hidden = false;
    const p = state.pred[n];
    s3.body.append(h("div", {class:"compare"}, h("strong", {}, "Ihre Vermutung: "), p !== undefined && p !== null ? `«${L.predict.opts[p]}»` : "(keine)", h("br"), h("strong", {}, "Auflösung: "), L.predict.answer));
    s3.body.append(h("div", {class:"merke", html:"<div class='merke-label'>Merke</div>" + L.explain}));
    buildChecks(L, s4.body);
    if (scroll) setTimeout(() => s3.el.scrollIntoView({behavior:"smooth", block:"start"}), 900);
  }
  L.predict.opts.forEach((t, i) => {
    const b = h("button", {class:"opt" + (state.pred[n] === i ? " chosen" : ""), type:"button"}, t);
    b.onclick = () => {
      state.pred[n] = i; save();
      [...optWrap.children].forEach((x, j) => x.classList.toggle("chosen", j === i));
      note.textContent = "Vermutung notiert. Prüfen Sie sie jetzt im Experiment.";
      openExp(!built);
    };
    optWrap.append(b);
  });
  if (state.pred[n] !== undefined && state.pred[n] !== null){ note.textContent = "Vermutung notiert."; openExp(false); }
  if (state.exp[n]) openRest(false);
  window.scrollTo(0, 0);
}

function buildChecks(L, wrap){
  let right = 0;
  wrap.append(h("p", {class:"muted note"}, "Beantworten Sie alle Fragen richtig, um den Code-Teil freizuschalten. Bei einer falschen Antwort erhalten Sie einen Hinweis und können es nochmals versuchen."));
  L.checks.forEach((c, qi) => {
    const box = h("div", {class:"check"}, h("p", {class:"q"}, `${qi+1}. ${c.q}`));
    const opts = h("div", {class:"opts"});
    const fb = h("div", {class:"fb", "aria-live":"polite"});
    let solved = false;
    c.opts.forEach(([t, ok, f]) => {
      const b = h("button", {class:"opt", type:"button"}, t);
      b.onclick = () => {
        if (solved) return;
        if (ok){
          solved = true; b.classList.add("ok"); [...opts.children].forEach(x => x.disabled = true);
          fb.className = "fb ok"; fb.innerHTML = "<strong>✓ Richtig.</strong> " + f;
          right++; if (right === L.checks.length) solve(L, wrap);
        } else {
          b.classList.add("bad"); b.disabled = true;
          fb.className = "fb bad"; fb.innerHTML = "<strong>✗ Noch nicht.</strong> " + f;
        }
      };
      opts.append(b);
    });
    box.append(opts, fb); wrap.append(box);
  });
}

function solve(L, wrap){
  const first = !state.solved[L.n];
  state.solved[L.n] = true; save(); renderCode();
  const next = L.n < 7;
  const r = h("div", {class:"reward", role:"status"},
    h("div", {class:"reward-tile", "aria-hidden":"true"}, L.letter),
    h("div", {},
      h("strong", {}, first ? "Code-Teil gefunden!" : "Code-Teil bestätigt."),
      h("p", {}, `Teil ${L.n} des Türcodes lautet «${L.letter}». Das System «${L.sys}» läuft wieder.`),
      h("button", {class:"btn primary", type:"button", onclick:() => go(next ? "level-" + (L.n + 1) : "home")}, next ? `Weiter zu Level ${L.n + 1} →` : "Zur Stationskarte: Tür öffnen →")));
  wrap.append(r);
  setTimeout(() => r.scrollIntoView({behavior:"smooth", block:"center"}), 100);
}

function renderFinale(){
  resetAnim(); view.innerHTML = "";
  const wrap = h("div", {class:"finale-svg"});
  const sec = h("section", {class:"finale"}, wrap);
  view.append(sec);
  const sv = svgIn(wrap, "0 0 200 200", "Leuchtende Glühbirne");
  const g = s("circle", {cx:100, cy:85, r:95, fill:"url(#g-glow)", opacity:1}, sv);
  s("circle", {cx:100, cy:85, r:48, class:"glass"}, sv);
  s("path", {d:"M84 132 L82 82 L90 96 L100 74 L110 96 L118 82 L116 132", class:"filament hot"}, sv);
  s("rect", {x:78, y:130, width:44, height:36, rx:5, class:"metal"}, sv);
  [140, 148, 156].forEach(y => s("line", {x1:78, x2:122, y1:y, y2:y, class:"thread"}, sv));
  s("circle", {cx:100, cy:172, r:7, class:"tip"}, sv);
  sec.append(h("h2", {}, "Licht an!"),
    h("p", {}, "Die Tür öffnet sich, im Kontrollraum gehen alle Lichter an. Sie haben die Station Volta gerettet."),
    h("p", {class:"q"}, "Das haben Sie unterwegs herausgefunden:"),
    h("ul", {},
      h("li", {}, "Strom fliesst nur in einem geschlossenen Stromkreis. Ein Kurzschluss ist gefährlich."),
      h("li", {}, "Metalle, Grafit und Salzwasser leiten. Kunststoff, Glas und Gummi isolieren."),
      h("li", {}, "Spannung treibt an, Widerstand bremst, Strom fliesst: I = U / R."),
      h("li", {}, "Eine LED braucht einen Vorwiderstand, sonst brennt sie durch."),
      h("li", {}, "In Reihe: ein Weg für alle. Parallel: jeder hat einen eigenen Weg."),
      h("li", {}, "Transistoren sind Schalter. Mit ihnen baut man UND- und ODER-Gatter, die Grundbausteine des Computers."),
      h("li", {}, "Sensor → Transistor → LED: Eingabe, Verarbeitung, Ausgabe.")),
    h("button", {class:"btn primary", type:"button", onclick:() => go("home")}, "Zurück zur Stationskarte"));
  window.scrollTo(0, 0);
}

function route(r){
  current = r;
  const m = /^level-(\d)$/.exec(r || "");
  if (m && +m[1] >= 1 && +m[1] <= 7 && unlocked(+m[1])) renderLevel(+m[1]);
  else if (r === "finale" && state.final) renderFinale();
  else { current = "home"; renderHome(); }
}
function go(r){ route(r); try { if (location.hash.slice(1) !== current) location.hash = current; } catch(e) {} }
window.addEventListener("hashchange", () => { const r = location.hash.slice(1) || "home"; if (r !== current) route(r); });

/* ---------- Design-Umschalter, Lehrperson, Reset ---------- */
function setVariant(v){
  state.variant = v; save();
  document.documentElement.dataset.variant = v;
  document.querySelectorAll(".seg[aria-label='Design wählen'] button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v));
  if (current === "home") renderHome();
}
document.querySelectorAll(".seg[aria-label='Design wählen'] button").forEach(b => b.onclick = () => setVariant(b.dataset.v));
const teacherBtn = document.getElementById("teacherBtn");
function paintTeacher(){ teacherBtn.textContent = state.teacher ? "Lehrperson: Levels wieder nacheinander" : "Lehrperson: alle Levels öffnen"; }
teacherBtn.onclick = () => { state.teacher = !state.teacher; save(); paintTeacher(); if (current === "home") renderHome(); };
const resetWrap = document.getElementById("resetWrap");
function paintReset(){
  resetWrap.innerHTML = "";
  const b = h("button", {class:"btn ghost", type:"button"}, "Fortschritt zurücksetzen");
  b.onclick = () => {
    resetWrap.innerHTML = "";
    resetWrap.append(h("span", {class:"confirm"}, "Wirklich alles löschen?",
      h("button", {class:"btn ghost", type:"button", onclick:() => { const v = state.variant; state = {variant:v, solved:{}, pred:{}, exp:{}, teacher:false, final:false}; save(); paintTeacher(); renderCode(); paintReset(); go("home"); }}, "Ja, löschen"),
      h("button", {class:"btn ghost", type:"button", onclick:paintReset}, "Abbrechen")));
  };
  resetWrap.append(b);
}

setVariant(state.variant === "b" ? "b" : "a");
paintTeacher(); paintReset(); renderCode();
route(location.hash.slice(1) || "home");
</script>
</body>
</html>
